# CI: en cada PR y en cada push a main corre install, lint, typecheck y build.
# Versiones de las actions verificadas el 12/11/2026 en sus páginas de releases:
# actions/checkout v7.0.1, pnpm/action-setup v6.1.1, actions/setup-node v7.1.0.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Sin `version`: toma pnpm del campo packageManager de package.json.
      - uses: pnpm/action-setup@v6

      # pnpm tiene que estar instalado antes para que funcione cache: pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
